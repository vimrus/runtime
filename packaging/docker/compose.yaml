# ZenTao Runtime Compose template.
#
# Web container: zentao-runtime with embedded Caddy + FrankenPHP Classic.
# MySQL (optional profile): separate pinned MySQL 8.4 container.
#
# For external PostgreSQL or MySQL, do not start the mysql service and
# configure the application database through ZenTao environment variables.
services:
  web:
    image: ghcr.io/vimrus/zentao:dev
    build:
      context: ../..
      dockerfile: packaging/runtime/Dockerfile
      target: runtime
    command: ["serve"]
    environment:
      ZENTAO_RUNTIME_ROOT: /opt/zentao/app/zentaopms/www
      ZENTAO_RUNTIME_LISTEN: "0.0.0.0:8080"
      ZENTAO_RUNTIME_CONTROL_SOCKET: /run/zentao/runtime.sock
      ZENTAO_RUNTIME_PID_FILE: /run/zentao/runtime.pid
      ZT_DB_DRIVER: "${ZT_DB_DRIVER:-mysql}"
      ZT_DB_HOST: "${ZT_DB_HOST:-mysql}"
      ZT_DB_PORT: "${ZT_DB_PORT:-3306}"
      ZT_DB_NAME: "${ZT_DB_NAME:-zentao}"
      ZT_DB_USER: "${ZT_DB_USER:-zentao}"
      ZT_DB_PASSWORD: "${ZT_DB_PASSWORD:-zentao}"
      ZT_DB_PREFIX: "${ZT_DB_PREFIX:-zt_}"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    volumes:
      - zentao-app:/opt/zentao/app
      - zentao-data:/opt/zentao/data
      # Create config/runtime.toml from config/runtime.example.toml first.
      - ../../config/runtime.toml:/opt/zentao/config/runtime.toml:ro
      - zentao-observability:/opt/zentao/observability
      - zentao-spool:/opt/zentao/spool/observability
      - zentao-logs:/opt/zentao/logs
    healthcheck:
      test: ["CMD", "sh", "/opt/zentao/packaging/docker/healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 45s

  mysql:
    # Pin to an immutable MySQL 8.4 LTS digest before production use.
    image: "${MYSQL_IMAGE:-mysql:8.4}"
    profiles: ["full"]
    environment:
      MYSQL_DATABASE: zentao
      MYSQL_USER: "${ZT_DB_USER:-zentao}"
      MYSQL_PASSWORD: "${ZT_DB_PASSWORD:-zentao}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-zentao-root}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  zentao-app:
  zentao-data:
  zentao-observability:
  zentao-spool:
  zentao-logs:
  mysql-data:
