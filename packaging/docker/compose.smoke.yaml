# Smoke-test Compose file: runs the locally built Runtime image (produced by
# scripts/native/build-linux.sh amd64) with the PHP fixtures and verifies
# readiness through the public port. Not intended for production.
services:
  web:
    image: zentao:runtime-linux-amd64
    command: ["serve"]
    environment:
      ZENTAO_RUNTIME_ROOT: /opt/zentao/app/zentaopms/www
      ZENTAO_RUNTIME_LISTEN: "0.0.0.0:8080"
      ZENTAO_RUNTIME_CONTROL_SOCKET: /tmp/zentao-runtime.sock
      ZENTAO_RUNTIME_PID_FILE: /tmp/zentao-runtime.pid
    ports:
      - "18080:8080"
    volumes:
      - ../../tests/fixtures/php:/opt/zentao/app/zentaopms/www:ro
      - ../../tests/fixtures/runtime/runtime.toml:/opt/zentao/config/runtime.toml:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/_runtime/readiness"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s
