zend_extension=${ZENTAO_RUNTIME_PHP_ROOT}/php/lib/ioncube/ioncube_loader_lin_8.4_ts.so
zend_extension=${ZENTAO_RUNTIME_PHP_ROOT}/php/lib/php/extensions/no-debug-zts-20240924/opcache.so

expose_php=Off
display_errors=Off
log_errors=On
error_log=${ZENTAO_RUNTIME_PHP_ROOT}/logs/php-error.log
memory_limit=256M
max_execution_time=120
post_max_size=64M
upload_max_filesize=64M
date.timezone=Asia/Shanghai

opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
