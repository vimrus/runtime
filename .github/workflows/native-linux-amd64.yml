name: Linux native compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/native-linux-amd64.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'packaging/runtime/**'
      - 'patches/php/8.4/**'
      - 'scripts/native/**'
      - 'scripts/build/**'
      - 'tests/fixtures/php/**'
      - 'tests/fixtures/runtime/**'
      - 'go.mod'
      - 'go.sum'
      - 'versions.lock.json'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Build Linux amd64 Runtime
        env:
          GOPROXY: https://proxy.golang.org,direct
          DEBIAN_MIRROR: http://deb.debian.org/debian
          DEBIAN_SECURITY_MIRROR: http://deb.debian.org/debian-security
        run: scripts/native/build-linux.sh amd64

      - name: Verify no database drivers embedded
        run: scripts/package/verify-no-db-driver.sh dist/runtime-linux-amd64/bin/zentao

      - name: Test Classic mode and ionCube
        run: scripts/native/test-linux.sh amd64

      - name: Install dry run
        run: tests/install/install-dry-run.sh

      - name: Docker Compose smoke
        run: tests/docker/compose-smoke.sh

      - name: Application package smoke
        run: |
          appdir="$(mktemp -d)"
          mkdir -p "${appdir}/www"
          cp tests/fixtures/php/index.php tests/fixtures/php/state.php "${appdir}/www/"
          printf '<?php // install\n' > "${appdir}/www/install.php"
          printf '22.0\n' > "${appdir}/VERSION"
          tar -czf /tmp/apppkg.tar.gz -C "${appdir}" .
          tests/e2e/zentao-app-smoke.sh /tmp/apppkg.tar.gz

      - name: Pluggable multi-application smoke
        run: tests/e2e/multi-app-smoke.sh

      - name: Access log smoke
        run: |
          appdir="$(mktemp -d)"
          scripts/ci/make-synthetic-app-package.sh "${appdir}"
          tests/e2e/access-log-smoke.sh "${appdir}"

      - name: Observability bridge smoke
        run: tests/e2e/observability-bridge-smoke.sh

      - name: Observability dual-node smoke
        run: tests/e2e/observability-dual-node-smoke.sh

      - name: Observability read-only smoke
        run: tests/e2e/observability-readonly-smoke.sh

      - name: Observability fault-recovery smoke
        run: tests/e2e/observability-fault-recovery-smoke.sh

      - name: Redis cache smoke
        run: tests/e2e/redis-cache-smoke.sh

      - name: Upload Runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zentao-runtime-linux-amd64-compatibility
          path: dist/runtime-linux-amd64
          if-no-files-found: error
          retention-days: 7

  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Build Linux arm64 Runtime
        env:
          GOPROXY: https://proxy.golang.org,direct
          DEBIAN_MIRROR: http://deb.debian.org/debian
          DEBIAN_SECURITY_MIRROR: http://deb.debian.org/debian-security
        run: scripts/native/build-linux.sh arm64

      - name: Verify no database drivers embedded
        run: scripts/package/verify-no-db-driver.sh dist/runtime-linux-arm64/bin/zentao

      - name: Smoke test Linux arm64 (PHP / ionCube / extensions)
        run: scripts/native/test-linux.sh arm64

      - name: Verify DM8 arm64 client closure in artifact
        run: |
          test "$(find dist/runtime-linux-arm64/php/lib -maxdepth 1 -name 'libdm*.so' | wc -l)" -eq 19
          test -f dist/runtime-linux-arm64/php/lib/dependencies/libssl.so
          test -f dist/runtime-linux-arm64/config/dm_svc.conf

      - name: Generate manifest and SBOM
        run: |
          scripts/package/generate-manifest.sh dist/runtime-linux-arm64
          scripts/package/generate-sbom.sh dist/runtime-linux-arm64

      - name: Upload Runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zentao-runtime-linux-arm64-compatibility
          path: dist/runtime-linux-arm64
          if-no-files-found: error
          retention-days: 7
