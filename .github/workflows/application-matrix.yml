name: Application package matrix

on:
  workflow_dispatch:
    inputs:
      app_package_path:
        description: "Runner-local path to a provided ZenTao application package (tar/tar.gz/tar.xz/tar.zst/zip) or unpacked app directory"
        required: true

permissions:
  contents: read

# Consumes externally produced, platform-independent ZenTao application
# packages (Z-REL-01). Runs only on private/self-hosted runners with access
# to paid packages; packages are never uploaded to public artifacts.
jobs:
  verify-and-stage:
    strategy:
      fail-fast: false
      matrix:
        edition: [opensource, biz, max, ipd]
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check out Runtime
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Verify and stage ${{ matrix.edition }} package
        run: |
          root="$(mktemp -d)"
          web_root="$(scripts/ci/stage-app-package.sh "${{ github.event.inputs.app_package_path }}" "${root}/app")"
          test -f "${web_root}/index.php"
          echo "edition artifact staged: ${{ matrix.edition }}"
          echo "web_root=${web_root}" >> "${GITHUB_ENV}"

      - name: Reject forbidden contents
        run: |
          root="$(mktemp -d)"
          scripts/ci/stage-app-package.sh "${{ github.event.inputs.app_package_path }}" "${root}/app" >/dev/null
          for forbidden in .git __pycache__ node_modules .cache; do
            if find "${root}/app/app/releases" -name "${forbidden}" -print -quit | grep -q .; then
              echo "package contains forbidden entry: ${forbidden}" >&2
              exit 1
            fi
          done
