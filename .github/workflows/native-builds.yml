name: Native platform builds

on:
  workflow_dispatch:
  push:
    tags:
      - "runtime/v*"

permissions:
  contents: read

concurrency:
  group: native-builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      GOPROXY: https://proxy.golang.org,direct
      DEBIAN_MIRROR: http://deb.debian.org/debian
      DEBIAN_SECURITY_MIRROR: http://deb.debian.org/debian-security
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.4.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Build Linux ${{ matrix.arch }} Runtime
        run: scripts/native/build-linux.sh ${{ matrix.arch }}

      - name: Smoke test Linux ${{ matrix.arch }}
        run: scripts/native/test-linux.sh ${{ matrix.arch }}

      - name: Assemble package
        run: |
          mkdir -p dist/package
          scripts/package/generate-manifest.sh dist/poc-linux-${{ matrix.arch }}
          scripts/package/generate-sbom.sh dist/poc-linux-${{ matrix.arch }}
          scripts/package/assemble-runtime.sh dist/poc-linux-${{ matrix.arch }} zentao-runtime-linux-${{ matrix.arch }} dist/package
          scripts/package/verify-package.sh dist/package/zentao-runtime-linux-${{ matrix.arch }}.tar.zst

      - name: Assemble Full package
        run: |
          scripts/package/assemble-full.sh dist/poc-linux-${{ matrix.arch }} linux-${{ matrix.arch }} zentao-full-linux-${{ matrix.arch }} dist/package

      - name: Upload Linux ${{ matrix.arch }} package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zentao-runtime-linux-${{ matrix.arch }}
          path: dist/package/zentao-runtime-linux-${{ matrix.arch }}.*
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux ${{ matrix.arch }} Full package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zentao-full-linux-${{ matrix.arch }}
          path: dist/package/zentao-full-linux-${{ matrix.arch }}.*
          if-no-files-found: error
          retention-days: 7

  build-windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.4.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Build Windows x86_64 Runtime
        shell: pwsh
        run: ./scripts/windows/build.ps1

      - name: Generate manifest and SBOM
        shell: pwsh
        run: |
          bash scripts/package/generate-manifest.sh dist/runtime-windows-x64
          bash scripts/package/generate-sbom.sh dist/runtime-windows-x64

      - name: Assemble Full package (Windows)
        shell: pwsh
        run: |
          choco install zstd -y --no-progress | Out-Null
          bash scripts/package/assemble-full.sh dist/runtime-windows-x64 windows-x64 zentao-full-windows-x64 dist/package

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zentao-runtime-windows-x64
          path: dist/runtime-windows-x64
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows Full package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zentao-full-windows-x64
          path: dist/package/zentao-full-windows-x64.*
          if-no-files-found: error
          retention-days: 7

      - name: Integrated environment assembly and smoke (Windows)
        shell: pwsh
        env:
          ZENTAO_RUNTIME_STAGE: dist/runtime-windows-x64
          ZENTAO_APP_PACKAGES_DIR: .cache/synthetic
        run: |
          bash scripts/ci/make-synthetic-app-package.sh .cache/synthetic/open
          bash scripts/package/build-integrated-env.sh open dist/zentao-open-win64 --platform windows
          $root = (Resolve-Path dist/zentao-open-win64).Path
          powershell -NoProfile -ExecutionPolicy Bypass -File "$root\bin\render-config.ps1" -Root $root
          & "$root\runtime\zentao-runtime.exe" version
          if ($LASTEXITCODE -ne 0) { throw "zentao-runtime.exe version check failed: $LASTEXITCODE" }
          $env:PHPRC = "$root\config"
          $proc = Start-Process -FilePath "$root\runtime\zentao-runtime.exe" `
              -ArgumentList 'serve','--config',"$root\config\runtime.json",'--install-root',$root `
              -PassThru -WindowStyle Hidden `
              -RedirectStandardOutput "$root\logs\run.out.log" `
              -RedirectStandardError "$root\logs\run.err.log"
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $resp = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8080/_runtime/readiness" -TimeoutSec 2
                if ($resp.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) {
              if ($proc.HasExited) {
                Write-Host "runtime exited with code $($proc.ExitCode)"
              }
              Get-Content "$root\logs\run.out.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
              Get-Content "$root\logs\run.err.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
              Get-Content "$root\logs\runtime.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
              throw "Windows integrated environment readiness failed"
            }
            $body = (Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8080/").Content
            $json = $body | ConvertFrom-Json
            if (-not $json.ioncube -or -not $json.zts) { throw "PHP/ionCube check failed: $body" }
            & "$root\runtime\php.exe" -d "zend_extension=$root\runtime\ioncube_loader_win_8.4.dll" -r "exit(extension_loaded('ionCube Loader')?0:1);"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows integrated environment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zentao-integrated-env-windows-x64
          path: dist/zentao-open-win64
          if-no-files-found: error
          retention-days: 7
